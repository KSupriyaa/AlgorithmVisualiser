<script>
  // Function to perform Bubble Sort
  async function bubbleSort(arr) {
    let n = arr.length;
    for (let i = 0; i < n - 1; i++) {
      for (let j = 0; j < n - i - 1; j++) {
        if (arr[j] > arr[j + 1]) {
          let temp = arr[j];
          arr[j] = arr[j + 1];
          arr[j + 1] = temp;
          await new Promise((resolve) => setTimeout(resolve, 100)); // Delay for visualization
          updateBars(arr); // Update the bars on each swap
        }
      }
    }
  }

  // Function to perform Reverse Bubble Sort
  async function reverseBubbleSort(arr) {
    let n = arr.length;
    for (let i = 0; i < n - 1; i++) {
      for (let j = 0; j < n - i - 1; j++) {
        if (arr[j] < arr[j + 1]) {
          let temp = arr[j];
          arr[j] = arr[j + 1];
          arr[j + 1] = temp;
          await new Promise((resolve) => setTimeout(resolve, 100)); // Delay for visualization
          updateBars(arr); // Update the bars on each swap
        }
      }
    }
  }

  // Function to generate random array of heights for the bars
  function generateRandomArray(size, min, max) {
    let arr = [];
    for (let i = 0; i < size; i++) {
      arr.push(Math.floor(Math.random() * (max - min + 1)) + min);
    }
    return arr;
  }

  // Function to create the bar elements
  function createBars(arr) {
    let barsContainer = document.getElementById('bars-container');
    barsContainer.innerHTML = '';

    for (let i = 0; i < arr.length; i++) {
      let bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = arr[i] + 'px';
      barsContainer.appendChild(bar);
    }
  }

  // Function to update the bar heights based on the array
  function updateBars(arr) {
    let bars = document.getElementsByClassName('bar');
    for (let i = 0; i < arr.length; i++) {
      bars[i].style.height = arr[i] + 'px';
    }
  }

  // Function to animate the sorting and unsorting process
  async function animateSort() {
    let arr = generateRandomArray(10, 20, 200); // Change size, minimum, and maximum values as needed
    createBars(arr);

    while (true) {
      await bubbleSort(arr.slice());
      await reverseBubbleSort(arr.slice().reverse());
    }
  }

  animateSort();
</script>
