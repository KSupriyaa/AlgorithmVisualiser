<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bubble Sort Visualizer</title>
    <link rel="stylesheet" href="/BubbleSort/Style.css">
</head>


<body> 
    <!-- <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" >BruteForce Techniques</a> 
        </nav> -->
    <div class="backcolor">
        <section class="section-gap">

            <h1>Bubble Sort</h1>
            <p> About the algorithm:</p>
            <hr>
            <p> Bubble Sort works by examining each set of adjacent elements, from left to right,
                switching their positions when they are out of order. </p>
            <h3>Time Complexity: O(n2) </h3>
            <h3>Space Complexity: O(1) </h3>
        </section>
    </div>
    <div id="bars-container"></div>
    <div class="controls">
        <button id="randomize-array-btn" class="rab">Randomize</button>
        <div class="speed-slider">
            <label for="speed-slider">Sorting Speed:</label>
            <input type="range" id="speed-slider" min="1" max="100" value="50">
        </div>
        <button id="sort-btn" class="sb">Sort</button>
       
        <!-- <button id="pause-btn" class="pb"> Pause</button> -->
        <!-- <button id="play-btn" class="plb">Play</button> -->
    </div>
    <div>
        <p id="sec"></p>
    </div>
    <script src="/BubbleSort/script.js"></script>
</body>
</html>
